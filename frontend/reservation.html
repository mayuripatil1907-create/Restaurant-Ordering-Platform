<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table Reservation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Restaurant<span>Platform</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="reservation.html">Reservation</a>
        <a href="cart.html">Cart</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<section class="form-section">

    <div class="form-box">

        <h2>Reserve Your Table</h2>

        <form onsubmit="event.preventDefault(); makeReservation();">

            <input
                type="text"
                id="customer-name"
                placeholder="Your Name"
                required
            >

            <input
                type="date"
                id="reservation-date"
                required
            >

            <input
                type="time"
                id="reservation-time"
                required
            >

            <input
                type="number"
                id="guests"
                placeholder="Number of Guests"
                min="1"
                required
            >

            <select id="table-id" required>
                
       <option value="">Select Table</option>
       <option value="1">Table 1 - 2 Seats</option>
       <option value="2">Table 2 - 4 Seats</option>
       <option value="3">Table 3 - 4 Seats</option>
       <option value="4">Table 4 - 6 Seats</option>
       <option value="5">Table 5 - 8 Seats</option>
</select>

            <button type="submit" class="btn">
                Reserve Table
            </button>

        </form>

    </div>

</section>

<footer>
    <h3>Restaurant Ordering Platform</h3>
    <p>Modern restaurant ordering and table management system.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
